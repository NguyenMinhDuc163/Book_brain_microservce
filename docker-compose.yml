version: '3.8'

services:
  gateway:
    container_name: api_gateway
    image: nguyenduc1603/book-brain-gateway:tagname
    env_file:
      - ./gateway/.env
    ports:
      - "4000:8080"
    depends_on:
      - book_brain
      - recommend
    networks:
      - app-network

  book_brain:
    container_name: book_brain_app
    build:
      context: ./book_brain_service
    ports:
      - "3001:3000"
    environment:
      - DB_HOST=20.255.153.62
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=NguyenDuc@163
      - DB_NAME=book_brain_db
      - DB_DIALECT=postgres
      - NODE_ENV=production
    networks:
      - app-network

  recommend:
    container_name: recommend_service
    build:
      context: ./recommend_service
    ports:
      - "5000:5000"
    volumes:
      - ./recommend_service:/app
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
      - DB_HOST=20.255.153.62
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=NguyenDuc@163
      - DB_NAME=book_brain_db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 